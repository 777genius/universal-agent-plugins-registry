name: SkillSpector static reports

on:
  push:
    branches: [main]
    paths:
      - "registry/skillspector-selection.json"
      - "registry/index.json"
      - "registry/directory.json"
      - "registry/publication/trusted-keys.json"
      - "registry/discovery/trusted-keys.json"
      - "schemas/discovery-*.schema.json"
      - "docs/skillspector/controlled-sources-*.json"
      - "schemas/skillspector-*.schema.json"
      - "scripts/*skillspector*.py"
      - "scripts/build_bridges.py"
      - "scripts/build_discovery_index.py"
      - "scripts/discovery_checkpoint.py"
      - "scripts/discovery_publication.py"
      - "tests/test_skillspector*.py"
      - ".github/workflows/skillspector-reports.yml"
  pull_request:
    paths:
      - "scripts/*skillspector*.py"
      - "scripts/build_bridges.py"
      - "scripts/build_discovery_index.py"
      - "schemas/skillspector-*.schema.json"
      - "tests/test_skillspector*.py"
      - "docs/skillspector/controlled-sources-*.json"
      - ".github/workflows/skillspector-reports.yml"
  schedule:
    - cron: "19 */6 * * *"
  workflow_dispatch:
    inputs:
      discovery_pages:
        description: "Catalog pages (1 for a small integration check, 50 for normal coverage)"
        type: choice
        options: ["50", "1"]
        default: "50"
      corpus:
        description: "Full catalog or the immutable regression corpus (13 Cloudflare skills and 2 prior failures)"
        type: choice
        options: ["catalog", "controlled"]
        default: "catalog"
      maximum_attempts:
        description: "Maximum fresh scan attempts per partition"
        type: choice
        options: ["128", "256", "512", "8"]
        default: "128"
      scan_budget_seconds:
        description: "Total cooperative scanner budget per partition (300/600 for manual checks)"
        type: choice
        options: ["2100", "600", "300"]
        default: "2100"

permissions:
  contents: read
  actions: read

concurrency:
  group: skillspector-static-reports-${{ github.ref }}
  queue: max
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == '777genius/universal-agent-plugins-registry' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request')
    # Read-only analysis uses the configured CI pool; publication stays hosted.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-24.04' || vars.CI_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    outputs:
      partitions: ${{ steps.config.outputs.partitions }}
      partition_count: ${{ steps.config.outputs.partition_count }}
      corpus: ${{ steps.config.outputs.corpus }}
      maximum_attempts: ${{ steps.config.outputs.maximum_attempts }}
      scan_budget_seconds: ${{ steps.config.outputs.scan_budget_seconds }}
      plan_artifact: skillspector-plan-a${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python3 -m pip install --disable-pip-version-check cryptography==46.0.3 jsonschema==4.26.0 PyYAML==6.0.3
      - name: Resolve one effective configuration including read-only PR canaries
        id: config
        env:
          CONFIG_CORPUS: ${{ inputs.corpus }}
          CONFIG_ATTEMPTS: ${{ inputs.maximum_attempts }}
          CONFIG_BUDGET: ${{ inputs.scan_budget_seconds }}
          CONFIG_PAGES: ${{ inputs.discovery_pages }}
        run: python3 -m scripts.skillspector_recovery configure
      - name: Test discovery, scanner and publication boundaries
        run: python3 -m unittest tests.test_skillspector_acquisition tests.test_skillspector_community tests.test_skillspector_contract tests.test_skillspector_coverage tests.test_skillspector_coverage_v3 tests.test_skillspector_discovery tests.test_skillspector_exceptions tests.test_skillspector_profile_measurement tests.test_skillspector_publication tests.test_skillspector_publication_transport tests.test_skillspector_records_v3 tests.test_skillspector_redaction tests.test_skillspector_reports tests.test_skillspector_workflow_v3 tests.test_skillspector_checkpoints tests.test_skillspector_partial_recovery tests.test_skillspector_recovery
      - name: Read the previous immutable report snapshot
        if: steps.config.outputs.corpus != 'controlled'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -m scripts.publish_skillspector_coverage_v3 previous \
            --output-dir "${RUNNER_TEMP}/skillspector-plan/previous"
      - name: Discover immutable skills from the catalog and signed plugin feeds
        if: steps.config.outputs.corpus != 'controlled'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.sha }}
          DISCOVERY_PAGES: ${{ steps.config.outputs.discovery_pages }}
        run: |
          python3 -m scripts.discover_skillspector_sources \
            --source-commit "${SOURCE_COMMIT}" \
            --previous-selection "${RUNNER_TEMP}/skillspector-plan/previous/selection.json" \
            --previous-summary "${RUNNER_TEMP}/skillspector-plan/previous/coverage.json" \
            --max-pages "${DISCOVERY_PAGES}" --workers 8 --budget-seconds 1200 \
            --output "${RUNNER_TEMP}/skillspector-plan/selection.json" \
            --summary "${RUNNER_TEMP}/skillspector-plan/coverage.json"
      - name: Recover authenticated main checkpoints against the new selection
        if: github.ref == 'refs/heads/main' && steps.config.outputs.corpus != 'controlled'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python3 -m scripts.skillspector_recovery recover \
            --plan-dir "${RUNNER_TEMP}/skillspector-plan" --source-commit "${SOURCE_COMMIT}"
      - name: Select the immutable regression corpus
        if: steps.config.outputs.corpus == 'controlled'
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python3 -m scripts.prepare_skillspector_corpus \
            --selection docs/skillspector/controlled-sources-2026-10-28.json \
            --source-commit "${SOURCE_COMMIT}" \
            --output-dir "${RUNNER_TEMP}/skillspector-plan"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skillspector-plan-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/skillspector-plan
          if-no-files-found: error
          retention-days: 7

  scan:
    needs: prepare
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-24.04' || vars.CI_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 55
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        partition: ${{ fromJSON(needs.prepare.outputs.partitions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: source
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NVIDIA/SkillSpector
          ref: f3b25697d76256998ca9d42c198d256258d4c035 # v2.13.1
          persist-credentials: false
          path: scanner
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned tooling and locked scanner
        run: |
          python3 -m pip install --disable-pip-version-check uv==0.13.4 cryptography==46.0.3 jsonschema==4.26.0 PyYAML==6.0.3
          uv sync --directory scanner --frozen --no-dev --python 3.12
      - name: Qualify conservative directory reference patch on pinned scanner
        run: python3 source/scripts/patch_skillspector_directory_references.py scanner --verify
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        id: plan
        with:
          name: ${{ needs.prepare.outputs.plan_artifact }}
          path: ${{ runner.temp }}/skillspector-plan
      - name: Restore earlier acknowledged slices when this main job is retried
        id: resume
        if: github.ref == 'refs/heads/main' && github.run_attempt > 1
        working-directory: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -m scripts.skillspector_recovery resume-current \
            --plan-dir "${RUNNER_TEMP}/skillspector-plan" \
            --worker "${RUNNER_TEMP}/worker-${{ matrix.partition }}.json" --partition "${{ matrix.partition }}"
      - name: Configure finite remote checkpoint slices
        id: slices
        env:
          TOTAL_BUDGET: ${{ needs.prepare.outputs.scan_budget_seconds }}
          MAXIMUM_ATTEMPTS: ${{ needs.prepare.outputs.maximum_attempts }}
        run: |
          if [ "${TOTAL_BUDGET}" = 2100 ]; then
            echo "count=3" >> "${GITHUB_OUTPUT}"
            echo "budget=700" >> "${GITHUB_OUTPUT}"
            echo "attempts=$(( (MAXIMUM_ATTEMPTS + 2) / 3 ))" >> "${GITHUB_OUTPUT}"
          else
            echo "count=1" >> "${GITHUB_OUTPUT}"
            echo "budget=${TOTAL_BUDGET}" >> "${GITHUB_OUTPUT}"
            echo "attempts=${MAXIMUM_ATTEMPTS}" >> "${GITHUB_OUTPUT}"
          fi
      - name: Scan durable slice 1 without LLMs
        id: scan1
        if: ${{ !cancelled() && steps.plan.outcome == 'success' && steps.slices.outcome == 'success' && (steps.resume.outcome == 'success' || steps.resume.outcome == 'skipped') }}
        timeout-minutes: 15
        working-directory: source
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          PARTITION: ${{ matrix.partition }}
          PARTITION_COUNT: ${{ needs.prepare.outputs.partition_count }}
          MAXIMUM_ATTEMPTS: ${{ needs.prepare.outputs.maximum_attempts }}
          SLICE_ATTEMPTS: ${{ steps.slices.outputs.attempts }}
          SLICE_BUDGET: ${{ steps.slices.outputs.budget }}
        run: |
          previous="${RUNNER_TEMP}/skillspector-plan/previous"
          if [ -f "${RUNNER_TEMP}/skillspector-plan/previous-recovered/index.json" ]; then
            previous="${RUNNER_TEMP}/skillspector-plan/previous-recovered"
          fi
          python3 -m scripts.skillspector_coverage_v3 scan \
            --selection "${RUNNER_TEMP}/skillspector-plan/selection.json" \
            --scanner "${GITHUB_WORKSPACE}/scanner/.venv/bin/skillspector" \
            --previous-dir "${previous}" \
            --discovery-summary "${RUNNER_TEMP}/skillspector-plan/coverage.json" \
            --source-commit "${SOURCE_COMMIT}" \
            --partition-index "${PARTITION}" --partition-count "${PARTITION_COUNT}" \
            --maximum-attempts "${MAXIMUM_ATTEMPTS}" --slice-attempts "${SLICE_ATTEMPTS}" \
            --budget-seconds "${SLICE_BUDGET}" --output "${RUNNER_TEMP}/worker-${PARTITION}.json"
      - name: Validate and package slice 1 checkpoint after failures
        id: pack1
        if: ${{ always() && steps.scan1.outcome != 'skipped' && steps.plan.outcome == 'success' }}
        working-directory: source
        env:
          SCAN_CORPUS: ${{ needs.prepare.outputs.corpus }}
        run: |
          python3 -m scripts.skillspector_recovery pack \
            --plan-dir "${RUNNER_TEMP}/skillspector-plan" --worker "${RUNNER_TEMP}/worker-${{ matrix.partition }}.json" \
            --slice 1 --output-dir "${RUNNER_TEMP}/checkpoint-1"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && steps.pack1.outcome == 'success' }}
        with:
          name: skillspector-checkpoint-a${{ github.run_attempt }}-p${{ matrix.partition }}-s1
          path: ${{ runner.temp }}/checkpoint-1
          if-no-files-found: error
          retention-days: 90
      - name: Scan durable slice 2 without LLMs
        id: scan2
        if: ${{ !cancelled() && steps.plan.outcome == 'success' && steps.slices.outcome == 'success' && (steps.resume.outcome == 'success' || steps.resume.outcome == 'skipped') && steps.slices.outputs.count == '3' }}
        timeout-minutes: 15
        working-directory: source
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          PARTITION: ${{ matrix.partition }}
          PARTITION_COUNT: ${{ needs.prepare.outputs.partition_count }}
          MAXIMUM_ATTEMPTS: ${{ needs.prepare.outputs.maximum_attempts }}
          SLICE_ATTEMPTS: ${{ steps.slices.outputs.attempts }}
          SLICE_BUDGET: ${{ steps.slices.outputs.budget }}
        run: |
          previous="${RUNNER_TEMP}/skillspector-plan/previous"
          if [ -f "${RUNNER_TEMP}/skillspector-plan/previous-recovered/index.json" ]; then
            previous="${RUNNER_TEMP}/skillspector-plan/previous-recovered"
          fi
          python3 -m scripts.skillspector_coverage_v3 scan \
            --selection "${RUNNER_TEMP}/skillspector-plan/selection.json" \
            --scanner "${GITHUB_WORKSPACE}/scanner/.venv/bin/skillspector" \
            --previous-dir "${previous}" \
            --discovery-summary "${RUNNER_TEMP}/skillspector-plan/coverage.json" \
            --source-commit "${SOURCE_COMMIT}" \
            --partition-index "${PARTITION}" --partition-count "${PARTITION_COUNT}" \
            --maximum-attempts "${MAXIMUM_ATTEMPTS}" --slice-attempts "${SLICE_ATTEMPTS}" \
            --budget-seconds "${SLICE_BUDGET}" --output "${RUNNER_TEMP}/worker-${PARTITION}.json"
      - name: Validate and package slice 2 checkpoint after failures
        id: pack2
        if: ${{ always() && steps.scan2.outcome != 'skipped' && steps.plan.outcome == 'success' }}
        working-directory: source
        env:
          SCAN_CORPUS: ${{ needs.prepare.outputs.corpus }}
        run: |
          python3 -m scripts.skillspector_recovery pack \
            --plan-dir "${RUNNER_TEMP}/skillspector-plan" --worker "${RUNNER_TEMP}/worker-${{ matrix.partition }}.json" \
            --slice 2 --output-dir "${RUNNER_TEMP}/checkpoint-2"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && steps.pack2.outcome == 'success' }}
        with:
          name: skillspector-checkpoint-a${{ github.run_attempt }}-p${{ matrix.partition }}-s2
          path: ${{ runner.temp }}/checkpoint-2
          if-no-files-found: error
          retention-days: 90
      - name: Scan durable slice 3 without LLMs
        id: scan3
        if: ${{ !cancelled() && steps.plan.outcome == 'success' && steps.slices.outcome == 'success' && (steps.resume.outcome == 'success' || steps.resume.outcome == 'skipped') && steps.slices.outputs.count == '3' }}
        timeout-minutes: 15
        working-directory: source
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          PARTITION: ${{ matrix.partition }}
          PARTITION_COUNT: ${{ needs.prepare.outputs.partition_count }}
          MAXIMUM_ATTEMPTS: ${{ needs.prepare.outputs.maximum_attempts }}
          SLICE_ATTEMPTS: ${{ steps.slices.outputs.attempts }}
          SLICE_BUDGET: ${{ steps.slices.outputs.budget }}
        run: |
          previous="${RUNNER_TEMP}/skillspector-plan/previous"
          if [ -f "${RUNNER_TEMP}/skillspector-plan/previous-recovered/index.json" ]; then
            previous="${RUNNER_TEMP}/skillspector-plan/previous-recovered"
          fi
          python3 -m scripts.skillspector_coverage_v3 scan \
            --selection "${RUNNER_TEMP}/skillspector-plan/selection.json" \
            --scanner "${GITHUB_WORKSPACE}/scanner/.venv/bin/skillspector" \
            --previous-dir "${previous}" \
            --discovery-summary "${RUNNER_TEMP}/skillspector-plan/coverage.json" \
            --source-commit "${SOURCE_COMMIT}" \
            --partition-index "${PARTITION}" --partition-count "${PARTITION_COUNT}" \
            --maximum-attempts "${MAXIMUM_ATTEMPTS}" --slice-attempts "${SLICE_ATTEMPTS}" \
            --budget-seconds "${SLICE_BUDGET}" --output "${RUNNER_TEMP}/worker-${PARTITION}.json"
      - name: Validate and package slice 3 checkpoint after failures
        id: pack3
        if: ${{ always() && steps.scan3.outcome != 'skipped' && steps.plan.outcome == 'success' }}
        working-directory: source
        env:
          SCAN_CORPUS: ${{ needs.prepare.outputs.corpus }}
        run: |
          python3 -m scripts.skillspector_recovery pack \
            --plan-dir "${RUNNER_TEMP}/skillspector-plan" --worker "${RUNNER_TEMP}/worker-${{ matrix.partition }}.json" \
            --slice 3 --output-dir "${RUNNER_TEMP}/checkpoint-3"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && steps.pack3.outcome == 'success' }}
        with:
          name: skillspector-checkpoint-a${{ github.run_attempt }}-p${{ matrix.partition }}-s3
          path: ${{ runner.temp }}/checkpoint-3
          if-no-files-found: error
          retention-days: 90

  assemble:
    outputs:
      report_artifact: skillspector-static-report-v3-a${{ github.run_attempt }}
    needs: [prepare, scan]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-24.04' || vars.CI_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python3 -m pip install --disable-pip-version-check cryptography==46.0.3 jsonschema==4.26.0 PyYAML==6.0.3
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.prepare.outputs.plan_artifact }}
          path: ${{ runner.temp }}/skillspector-plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: skillspector-checkpoint-a${{ github.run_attempt }}-*
          merge-multiple: false
          path: ${{ runner.temp }}/skillspector-workers
      - name: Assemble validated available partitions and preserve missing work
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          previous="${RUNNER_TEMP}/skillspector-plan/previous"
          if [ -f "${RUNNER_TEMP}/skillspector-plan/previous-recovered/index.json" ]; then
            previous="${RUNNER_TEMP}/skillspector-plan/previous-recovered"
          fi
          # The artifact download action can flatten a single match into the root;
          # multiple matches retain per-artifact directories. Accept both layouts.
          shopt -s nullglob
          workers=( "${RUNNER_TEMP}"/skillspector-workers/skillspector-checkpoint-*/worker.json )
          if [ -f "${RUNNER_TEMP}/skillspector-workers/worker.json" ]; then
            workers+=( "${RUNNER_TEMP}/skillspector-workers/worker.json" )
          fi
          if [ "${#workers[@]}" -eq 0 ]; then
            echo "::error::No SkillSpector checkpoint worker was downloaded" >&2
            exit 1
          fi

          python3 -m scripts.skillspector_coverage_v3 merge \
            --selection "${RUNNER_TEMP}/skillspector-plan/selection.json" \
            --discovery-summary "${RUNNER_TEMP}/skillspector-plan/coverage.json" \
            --previous-dir "${previous}" \
            --source-commit "${SOURCE_COMMIT}" \
            --expected-partition-count "${{ needs.prepare.outputs.partition_count }}" --allow-partial-workers \
            --workers "${workers[@]}" \
            --output-dir "${RUNNER_TEMP}/skillspector-report"
          if [ -f "${previous}/publication-base.json" ]; then
            cp "${previous}/publication-base.json" "${RUNNER_TEMP}/skillspector-report/publication-base.json"
          fi
          python3 -m scripts.publish_skillspector_coverage_v3 check \
            --report-dir "${RUNNER_TEMP}/skillspector-report" --source-commit "${SOURCE_COMMIT}"
      - name: Acknowledge validated remote checkpoints for automatic later recovery
        if: github.ref == 'refs/heads/main' && needs.prepare.outputs.corpus != 'controlled'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -m scripts.skillspector_recovery acknowledge \
            --plan-dir "${RUNNER_TEMP}/skillspector-plan" --report-dir "${RUNNER_TEMP}/skillspector-report"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skillspector-static-report-v3-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/skillspector-report
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: [prepare, assemble]
    if: github.repository == '777genius/universal-agent-plugins-registry' && github.ref == 'refs/heads/main' && needs.prepare.outputs.corpus != 'controlled'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python3 -m pip install --disable-pip-version-check cryptography==46.0.3 jsonschema==4.26.0 PyYAML==6.0.3
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.assemble.outputs.report_artifact }}
          path: ${{ runner.temp }}/skillspector-report
      - name: Validate the exact artifact before enabling write credentials
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python3 -m scripts.publish_skillspector_coverage_v3 check \
            --report-dir "${RUNNER_TEMP}/skillspector-report" --source-commit "${SOURCE_COMMIT}"
      - name: Atomically publish display data and bounded progress
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python3 -m scripts.publish_skillspector_coverage_v3 publish \
            --report-dir "${RUNNER_TEMP}/skillspector-report" --source-commit "${SOURCE_COMMIT}" \
            --status-file "${RUNNER_TEMP}/skillspector-delivery.json"
