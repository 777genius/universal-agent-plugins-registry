name: SkillSpector three exhausted Unicode source pins read-only E2E

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/skillspector-470-exhausted-unicode-e2e.yml"

permissions:
  contents: read

concurrency:
  group: skillspector-470-exhausted-unicode-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pinned-three-root-acquisition:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact PR HEAD (no stored credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Checkout exact production-pinned SkillSpector 2.13.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NVIDIA/SkillSpector
          ref: f3b25697d76256998ca9d42c198d256258d4c035
          path: scanner
          persist-credentials: false
      - name: Checkout immutable published v3 status and retry ledger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: 777genius/universal-agent-plugins-registry
          ref: 7771404dcdfc5b3855f1319b5e9a2bc19d0c7acf
          path: original-v3
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            reports/skillspector/v3/index.json
            reports/skillspector/v3/selection.json
            reports/skillspector/v3/attempts.json
            reports/skillspector/v3/shards/37b5c59d6045b9de65157c28c02bf69440311a443584b1ec183401f973905076.json
            reports/skillspector/v3/shards/f56a7a84af239d9de0018abed24f063d6ff11c56ce41c9e89295a88fe30f6aa1.json
            reports/skillspector/v3/shards/39ff47bde08293830da21750e8bf01eb88507f2e8151e9d38860b689a9972426.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install pinned validation dependencies
        run: python3 -m pip install --disable-pip-version-check cryptography==46.0.3 jsonschema==4.26.0 PyYAML==6.0.3
      - name: Install exact locked no-LLM scanner (no provider keys)
        run: |
          python3 -m pip install --disable-pip-version-check uv==0.13.4
          uv sync --directory scanner --frozen --no-dev --python 3.12
          python3 scripts/patch_skillspector_directory_references.py scanner --verify
      - name: Run integration acquisition and negative safety tests
        run: python3 -m unittest tests.test_skillspector_acquisition.ColdAcquisitionTests -v
      - name: Acquire and statically scan three real exhausted Error roots
        timeout-minutes: 27
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import subprocess
          import tempfile
          from pathlib import Path

          from scripts.build_bridges import PinnedRepository
          from scripts.build_registry import directory_tree_digest
          from scripts.discovery_checkpoint import WorkBudget
          from scripts.skillspector_acquisition import bounded_package_files, materialize_scanned_files
          from scripts import skillspector_reports as static

          executable = Path("scanner/.venv/bin/skillspector").resolve()
          static.verify_scanner(executable)

          # Pinned historical Error/exhausted identities from original v3.
          # No fifth retry or source execution is authorized by this test.
          sources = (
              ("alchaincyf/feynman-skill", "b804a7fba592091d5d44844ab7bb75ca26bbfc2a", "",
               13, 200056, 5, "70bb7a7d5c2d8f27909884b3ca8adf74dec391cb"),
              ("alchaincyf/naval-skill", "b7600569776be0bd880e8457b1eae42df9f1d3e5", "",
               11, 171784, 1, "aa17a5efdced786f4dfbeb8609717a2a0bb0b5c9"),
              ("alchaincyf/taleb-skill", "6045c4d8ad1ea3a6e4b0872421c755c36782d1c8", "",
               13, 132556, 5, "c823eef7666c2ad717e2afcd7b66f99806821f99"),
          )
          evidence = []
          receipt = Path("/tmp/skillspector-470-unicode-exhausted-proof.json")
          def persist():
              status = ("failed" if any(item["status"] == "failed" for item in evidence)
                        else "passed" if len(evidence) == len(sources) else "in_progress")
              receipt.write_text(json.dumps(
                  {"schema_version": 1, "status": status, "sources": evidence,
                   "original_report_commit": "7771404dcdfc5b3855f1319b5e9a2bc19d0c7acf",
                   "new_production_attempt_authorized": False,
                   "published_reports_mutated": False,
                   "production_error_reduction": 0}, sort_keys=True, indent=2))
          persist()
          # Bind every acquisition experiment to the *original* authenticated
          # exhausted Error identity. This never schedules a new production
          # attempt or rewrites its eight retained history events.
          root_v3 = Path("original-v3/reports/skillspector/v3")
          original_head = subprocess.check_output(
              ["git", "-C", "original-v3", "rev-parse", "HEAD"], text=True).strip()
          assert original_head == "7771404dcdfc5b3855f1319b5e9a2bc19d0c7acf"
          manifest = json.loads((root_v3 / "index.json").read_bytes())
          assert manifest["schema_version"] == 3
          assert manifest["source_commit"] == "a12bd3bdffab6991a2541220a16a0a9d6447e47e"
          assert manifest["scanner"] == {"id": "skillspector", "version": "2.13.1",
              "revision": "f3b25697d76256998ca9d42c198d256258d4c035"}
          selected = json.loads((root_v3 / "selection.json").read_bytes())["sources"]
          retained = json.loads((root_v3 / "attempts.json").read_bytes())["attempts"]
          shard_index = {s["repository"]: s for s in manifest["shards"]
              if s["repository"] in {v[0] for v in sources}}
          verified_original = {}
          assert len(shard_index) == len(sources)
          for repository, revision, selected_root, *_ in sources:
              subject = [v for v in selected if v["repository"] == repository
                  and v["revision"] == revision and v["path"] == selected_root]
              assert len(subject) == 1, f"{repository}: ambiguous original identity"
              item = subject[0]
              descriptor = shard_index[repository]
              raw = (root_v3 / descriptor["path"]).read_bytes()
              assert len(raw) == descriptor["bytes"]
              assert "sha256:" + hashlib.sha256(raw).hexdigest() == descriptor["digest"]
              shard = json.loads(raw)
              assert shard["repository"] == repository
              assert shard["schema_version"] == 3 and shard["scanner"] == manifest["scanner"]
              records = [v for v in shard["records"] if v["id"] == item["id"]]
              attempts = [v for v in retained if v["id"] == item["id"]]
              assert len(records) == len(attempts) == descriptor["record_count"] == 1
              record, attempt = records[0], attempts[0]
              assert record["status"] == "error" and record["freshness"] == "current"
              assert record["source"]["revision"] == revision
              assert record["source"]["path"] == selected_root
              assert record["source"]["content_digest"] is None
              assert {v["code"] for v in record["coverage"]["reasons"]} == {"acquisition_failed"}
              assert attempt["status"] == "error" and attempt["attempt_count"] == 4
              assert attempt["disposition"] == "exhausted"
              assert attempt["reason"] == "transient_retry_limit"
              assert attempt["next_attempt_at"] is None and attempt["next_profile"] is None
              assert attempt["policy_digest"] == manifest["profile"]["digest"]
              assert len(attempt["history"]) == 8
              assert record["attempt_history"] == attempt["history"]
              assert record["retry"]["attempt_count"] == 4
              verified_original[repository] = {"source_id": item["id"],
                  "original_shard_digest": descriptor["digest"],
                  "original_retry_history_count": len(attempt["history"])}
          for repository, revision, selected_root, count, total_bytes, unicode_count, skill_blob in sources:
              entry = {"repository": repository, "revision": revision, "selected_root": selected_root,
                       "status": "in_progress", **verified_original[repository]}
              try:
                  pinned = PinnedRepository(repository, revision, None, work_budget=WorkBudget(120))
                  try:
                      files = bounded_package_files(pinned, selected_root, max_files=2048,
                          max_file_bytes=16 << 20, max_tree_bytes=16 << 20)
                      # Independently verified immutable Git tree at the latest signed v3 Error source pin; not scanner-generated counts.
                      # Never assume a prior revision's E2E proves a newer SHA.
                      assert len(files) == count, f"{repository}: dropped file(s)"
                      assert sum(len(body) for _, _, body in files) == total_bytes, f"{repository}: changed bytes"
                      assert sum(not path.isascii() for path, _, _ in files) == unicode_count
                      assert all(mode in (0o644, 0o755) for _, mode, _ in files)
                      primary = next((body for path, _, body in files if path == "SKILL.md"), None)
                      assert primary is not None, f"{repository}: missing root SKILL.md"
                      blob = hashlib.sha1(b"blob " + str(len(primary)).encode() + b"\0" + primary).hexdigest()
                      assert blob == skill_blob, f"{repository}: original SKILL.md Git blob differs"
                      with tempfile.TemporaryDirectory(prefix="skillspector-unicode-proof-") as directory:
                          root = Path(directory)
                          materialize_scanned_files(files, root, pinned.work_budget)
                          assert sum(path.is_file() for path in root.rglob("*")) == count
                          digest = directory_tree_digest(root)
                          with tempfile.TemporaryDirectory(prefix="isolated-skillspector-home-") as home_dir:
                              code, body = static.run_scanner_v3(
                                  executable, ["scan", str(root), "--no-llm", "--format", "json",
                                              "--fail-on-incomplete"], Path(home_dir), 180, "static-extended-v3")
                          report = static.parse_scanner_json(body, "real Unicode source scan")
                          completeness = report["analysis_completeness"]
                          assert code in (0, 1), f"{repository}: unexpected CLI exit {code}"
                          assert report["metadata"]["skillspector_version"] == "2.13.1"
                          assert report["metadata"]["llm_requested"] is False
                          assert report["metadata"]["inference_usage"] == []
                          assert report["execution_successful"] is True
                          assert completeness["execution_successful"] is True
                          assert isinstance(report["issues"], list)
                          assert directory_tree_digest(root) == digest, f"{repository}: source modified during analysis"
                          assert completeness["status"] in ("complete", "partial", "complete_with_caveats")
                          entry.update(status="complete_acquisition", file_count=count,
                              unicode_files=unicode_count, total_bytes=total_bytes, tree_digest=digest,
                              skill_md_blob=blob, scan_status=completeness["status"],
                              scan_is_complete=completeness["is_complete"],
                              scan_issue_count=len(report["issues"]), old_status="error",
                              certified_current=False)
                  finally:
                      pinned.close()
              except Exception as error:
                  entry.update(status="failed", failure_type=type(error).__name__,
                               reason=str(error)[:160])
                  raise
              finally:
                  evidence.append(entry)
                  persist()
          print(json.dumps(evidence, sort_keys=True))
          PY
      - name: Retain original independent E2E evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: skillspector-470-three-exhausted-unicode-proof
          path: /tmp/skillspector-470-unicode-exhausted-proof.json
          if-no-files-found: warn
          retention-days: 7
