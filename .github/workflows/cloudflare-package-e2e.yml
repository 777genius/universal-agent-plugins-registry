name: Cloudflare package configuration lifecycle

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'bridges/cloudflare*/**'
      - 'plugins/cloudflare*/**'
      - 'tests/e2e/cloudflare-package-lifecycle.cjs'
      - '.github/workflows/cloudflare-package-e2e.yml'

permissions:
  contents: read

concurrency:
  group: cloudflare-package-e2e-${{ github.event_name }}-${{ (github.event_name == 'pull_request' || github.event_name == 'push') && (github.event.pull_request.number || github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  lifecycle:
    name: ${{ matrix.package }} / CLI ${{ matrix.cli }} / eight synthetic profiles
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [cloudflare, cloudflare-bindings, cloudflare-observability]
        cli: ['0.1.26', '0.1.45']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.20.0'
      - name: Public CLI add, info, update and remove (no agent runtime or OAuth)
        run: node tests/e2e/cloudflare-package-lifecycle.cjs '${{ matrix.package }}' '${{ matrix.cli }}'
      - name: Upload sanitized lifecycle evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloudflare-lifecycle-${{ matrix.package }}-cli-${{ matrix.cli }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cloudflare-package-evidence/${{ matrix.package }}/summary.json
          if-no-files-found: error
          retention-days: 14
