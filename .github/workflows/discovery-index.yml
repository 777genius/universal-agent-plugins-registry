          MODE: ${{ needs.acquire.outputs.mode }}
          PREVIOUS_SNAPSHOT: ${{ needs.acquire.outputs.previous_snapshot }}
          PHASE_BUDGET_MINUTES: ${{ needs.acquire.outputs.timeout_minutes }}
        run: bash scripts/run_discovery_slice.sh validate
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
