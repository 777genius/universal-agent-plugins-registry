name: Signed Discovery Index

on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - "registry/directory.json"
      - "registry/discovery/**"
      - "registry/discovery/trusted-keys.json"
      - "schemas/discovery-*.schema.json"
      - "scripts/build_discovery_index.py"
      - "scripts/discovery_checkpoint.py"
      - "scripts/run_discovery_slice.sh"
      - "scripts/discovery_publication.py"
      - "scripts/feed_append_cas.py"
      - "scripts/sign_discovery_index.py"
      - "scripts/verify_discovery_index.py"
      - ".github/workflows/discovery-index.yml"
  schedule:
    - cron: "17 */6 * * *"
    - cron: "43 2 * * *"
    - cron: "11 3 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: Bounded discovery mode
        required: true
        default: refresh
        type: choice
        options: [refresh, discover, reconcile]

permissions:
  contents: read

env:
  LEDGER_BRANCH: directory-publication-ledger
  FEED_PATH: discovery
  UAP_ACTIVE_REPOSITORY: ${{ github.repository }}

jobs:
  publisher-preflight:
    name: Verify publisher can write before scanning
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: discovery-publication
    permissions:
      contents: read
    steps:
      - name: Request exact publisher capability
        id: publisher
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.DISCOVERY_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.DISCOVERY_PUBLISHER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Record non-secret publisher integration identity
        env:
          PUBLISHER_APP_ID: ${{ secrets.DISCOVERY_PUBLISHER_APP_ID }}
        run: |
          mkdir publisher-identity
          python3 -c 'import json,os; app_id=int(os.environ["PUBLISHER_APP_ID"]); assert app_id > 0; json.dump({"app_id": app_id}, open("publisher-identity/installation.json", "w"))'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: discovery-publisher-identity-${{ github.run_id }}
          path: publisher-identity/installation.json
          if-no-files-found: error
          retention-days: 1

  acquire:
    name: Acquire and retain discovery paths
    needs: publisher-preflight
    runs-on: ubuntu-latest
    # Acquisition and validation have independent budgets. A step timeout
    # leaves room for always-uploaded checkpoints before the job limit.
    timeout-minutes: 330
    environment: discovery-read
    permissions:
      contents: read
      actions: read
    outputs:
      ledger_head: ${{ steps.ledger.outputs.head }}
      previous_snapshot: ${{ steps.ledger.outputs.path }}
      mode: ${{ steps.mode.outputs.value }}
      timeout_minutes: ${{ steps.mode.outputs.timeout_minutes }}
      artifact_id: ${{ steps.scan.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.LEDGER_BRANCH }}
          path: ledger
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install pinned validation dependencies
        run: python3 -m pip install --disable-pip-version-check cryptography==46.0.3 jsonschema==4.26.0 PyYAML==6.0.3
      - name: Authenticate previous last-known-good snapshot
        id: ledger
        working-directory: source
        run: |
          echo "head=$(git -C ../ledger rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if test -f "../ledger/${FEED_PATH}/latest.json"; then
            python3 scripts/verify_discovery_index.py \
              --feed "../ledger/${FEED_PATH}" \
              --trusted-keys registry/discovery/trusted-keys.json
            snapshot_path="$(python3 -c 'import json; print(json.load(open("../ledger/discovery/latest.json"))["snapshot_path"])')"
            printf 'path=%s\n' "../ledger/${FEED_PATH}/${snapshot_path}" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
          fi
      - name: Select deterministic schedule mode and scan budget
        id: mode
        working-directory: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          REQUESTED_MODE: ${{ inputs.mode }}
          PREVIOUS_SNAPSHOT: ${{ steps.ledger.outputs.path }}
        run: |
          if test "${EVENT_NAME}" = workflow_dispatch; then
            mode="${REQUESTED_MODE}"
          elif test "${EVENT_NAME}" = schedule && test "${SCHEDULE}" = "11 3 * * 0"; then
            mode=reconcile
          elif test "${EVENT_NAME}" = schedule && test "${SCHEDULE}" = "43 2 * * *"; then
            mode=discover
          elif test "${EVENT_NAME}" = push; then
            mode=discover
          else
            mode=refresh
          fi
          case "${mode}" in refresh|discover|reconcile) ;; *) exit 1 ;; esac
          echo "value=${mode}" >> "$GITHUB_OUTPUT"
          # A fresh/empty authenticated refresh becomes discover in the builder.
          # Only a nonempty authenticated LKG can use the measured refresh budget.
          budget=300
          if test "${mode}" = refresh && test -n "${PREVIOUS_SNAPSHOT}"; then
            count="$(python3 -c 'import sys; from pathlib import Path; from scripts.build_discovery_index import load_previous; print(len(load_previous(Path(sys.argv[1]))))' "${PREVIOUS_SNAPSHOT}")"
            if test "${count}" -gt 0; then budget=120; fi
          fi
          echo "timeout_minutes=${budget}" >> "$GITHUB_OUTPUT"
      - name: Select prior same-run acquisition checkpoint
        id: resume
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          id="$(gh api --paginate --slurp "repos/${GH_REPO}/actions/runs/${RUN_ID}/artifacts?per_page=100" | jq -r --arg prefix "discovery-acquisition-${RUN_ID}-" --argjson attempt "${ATTEMPT}" '[.[].artifacts[] | select(.expired == false) | select(.name | startswith($prefix)) | . + {suffix: (.name | ltrimstr($prefix))} | select(.suffix | test("^[0-9]+-[0-9]+$")) | . + (.suffix | capture("^(?<attempt>[0-9]+)-(?<slice>[0-9]+)$") | with_entries(.value |= tonumber)) | select(.attempt > 0 and .attempt < $attempt and .slice >= 1 and .slice <= 10)] | sort_by(.attempt, .slice) | last | .id // empty')"
          echo "artifact_id=${id}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.resume.outputs.artifact_id != ''
        with:
          artifact-ids: ${{ steps.resume.outputs.artifact_id }}
          path: checkpoint
      - name: Set bounded acquisition slice context
        run: echo "DISCOVERY_PHASE_FINISHED=false" >> "$GITHUB_ENV"
      - name: acquisition slice 01
        id: slice01
        if: env.DISCOVERY_PHASE_FINISHED != 'true'
        timeout-minutes: 35
        working-directory: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MODE: ${{ steps.mode.outputs.value }}
          PREVIOUS_SNAPSHOT: ${{ steps.ledger.outputs.path }}
          PHASE_BUDGET_MINUTES: ${{ steps.mode.outputs.timeout_minutes }}
        run: bash scripts/run_discovery_slice.sh acquire
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: checkpoint01
        if: always() && steps.slice01.outcome != 'skipped'
        with:
          name: discovery-acquisition-${{ github.run_id }}-${{ github.run_attempt }}-01
          path: checkpoint/acquisition.json
          if-no-files-found: warn
          retention-days: 7
      - name: acquisition slice 02
        id: slice02
        if: env.DISCOVERY_PHASE_FINISHED != 'true'
        timeout-minutes: 35
        working-directory: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MODE: ${{ steps.mode.outputs.value }}
          PREVIOUS_SNAPSHOT: ${{ steps.ledger.outputs.path }}
          PHASE_BUDGET_MINUTES: ${{ steps.mode.outputs.timeout_minutes }}
        run: bash scripts/run_discovery_slice.sh acquire
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: checkpoint02
        if: always() && steps.slice02.outcome != 'skipped'
        with:
          name: discovery-acquisition-${{ github.run_id }}-${{ github.run_attempt }}-02
          path: checkpoint/acquisition.json
          if-no-files-found: warn
          retention-days: 7
      - name: acquisition slice 03
        id: slice03
        if: env.DISCOVERY_PHASE_FINISHED != 'true'
        timeout-minutes: 35
        working-directory: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MODE: ${{ steps.mode.outputs.value }}
          PREVIOUS_SNAPSHOT: ${{ steps.ledger.outputs.path }}
          PHASE_BUDGET_MINUTES: ${{ steps.mode.outputs.timeout_minutes }}
        run: bash scripts/run_discovery_slice.sh acquire
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: checkpoint03
        if: always() && steps.slice03.outcome != 'skipped'
        with:
          name: discovery-acquisition-${{ github.run_id }}-${{ github.run_attempt }}-03
          path: checkpoint/acquisition.json
          if-no-files-found: warn
          retention-days: 7
      - name: acquisition slice 04
        id: slice04
        if: env.DISCOVERY_PHASE_FINISHED != 'true'
        timeout-minutes: 35
        working-directory: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MODE: ${{ steps.mode.outputs.value }}
          PREVIOUS_SNAPSHOT: ${{ steps.ledger.outputs.path }}
          PHASE_BUDGET_MINUTES: ${{ steps.mode.outputs.timeout_minutes }}
        run: bash scripts/run_discovery_slice.sh acquire
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: checkpoint04
        if: always() && steps.slice04.outcome != 'skipped'
        with:
          name: discovery-acquisition-${{ github.run_id }}-${{ github.run_attempt }}-04
          path: checkpoint/acquisition.json
          if-no-files-found: warn
          retention-days: 7
      - name: acquisition slice 05
        id: slice05
        if: env.DISCOVERY_PHASE_FINISHED != 'true'
        timeout-minutes: 35
        working-directory: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MODE: ${{ steps.mode.outputs.value }}
          PREVIOUS_SNAPSHOT: ${{ steps.ledger.outputs.path }}
          PHASE_BUDGET_MINUTES: ${{ steps.mode.outputs.timeout_minutes }}
        run: bash scripts/run_discovery_slice.sh acquire
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: checkpoint05
        if: always() && steps.slice05.outcome != 'skipped'
        with:
