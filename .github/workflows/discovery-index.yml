          GITHUB_TOKEN: ${{ github.token }}
          MODE: ${{ steps.mode.outputs.value }}
          PREVIOUS_SNAPSHOT: ${{ steps.ledger.outputs.path }}
          PHASE_BUDGET_MINUTES: ${{ steps.mode.outputs.timeout_minutes }}
        run: bash scripts/run_discovery_slice.sh acquire
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: checkpoint10
        if: always() && steps.slice10.outcome != 'skipped'
        with:
          name: discovery-acquisition-${{ github.run_id }}-${{ github.run_attempt }}-10
          path: checkpoint/acquisition.json
          if-no-files-found: warn
          retention-days: 7
      - name: Require finished acquisition phase
        id: scan
        env:
          CHECKPOINT_ARTIFACT_ID: ${{ steps.checkpoint10.outputs.artifact-id || steps.checkpoint09.outputs.artifact-id || steps.checkpoint08.outputs.artifact-id || steps.checkpoint07.outputs.artifact-id || steps.checkpoint06.outputs.artifact-id || steps.checkpoint05.outputs.artifact-id || steps.checkpoint04.outputs.artifact-id || steps.checkpoint03.outputs.artifact-id || steps.checkpoint02.outputs.artifact-id || steps.checkpoint01.outputs.artifact-id }}
        run: |
          test "${DISCOVERY_PHASE_FINISHED}" = true
          test -n "${CHECKPOINT_ARTIFACT_ID}"
          echo "artifact_id=${CHECKPOINT_ARTIFACT_ID}" >> "$GITHUB_OUTPUT"

  scan:
    name: Validate retained inert public packages
    needs: acquire
    runs-on: ubuntu-latest
    timeout-minutes: 330
    environment: discovery-read
    permissions:
      contents: read
      actions: read
    outputs:
      complete: ${{ steps.scan.outputs.complete }}
      candidate_digest: ${{ steps.scan.outputs.candidate_digest }}
      artifact_id: ${{ steps.candidate.outputs.artifact-id }}
      ledger_head: ${{ needs.acquire.outputs.ledger_head }}
      mode: ${{ needs.acquire.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
