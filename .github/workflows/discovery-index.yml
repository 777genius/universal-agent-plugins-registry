      - name: acquisition slice 06
        id: slice06
        if: env.DISCOVERY_PHASE_FINISHED != 'true'
        timeout-minutes: 35
        working-directory: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MODE: ${{ steps.mode.outputs.value }}
          PREVIOUS_SNAPSHOT: ${{ steps.ledger.outputs.path }}
          PHASE_BUDGET_MINUTES: ${{ steps.mode.outputs.timeout_minutes }}
        run: bash scripts/run_discovery_slice.sh acquire
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: checkpoint06
        if: always() && steps.slice06.outcome != 'skipped'
        with:
          name: discovery-acquisition-${{ github.run_id }}-${{ github.run_attempt }}-06
          path: checkpoint/acquisition.json
