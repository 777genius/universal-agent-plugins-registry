name: SkillSpector failed pinned-root acquisition diagnosis

on:
  pull_request:
    paths:
      - ".github/workflows/skillspector-failed-root-diagnostic.yml"

permissions:
  contents: read

jobs:
  read-only-acquisition:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: e8d3d940f2faa60ab8391156b279f8f71315b9d6
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned unprivileged validation dependencies
        run: python3 -m pip install --disable-pip-version-check cryptography==46.0.3 jsonschema==4.26.0 PyYAML==6.0.3
      - name: Diagnose four actual immutable production Error roots
        timeout-minutes: 12
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import time
          from pathlib import Path

          from scripts.build_bridges import PinnedRepository
          from scripts.discovery_checkpoint import WorkBudget
          from scripts.skillspector_acquisition import bounded_package_files

          # Current error witnesses from immutable production report 54e653bb.
          # Fixed identities: do not follow branch names or execute source files.
          subjects = (
              ("alchaincyf/elon-musk-skill", "65af7c9a5395cc996d17f55b5bde37e6ed72cf4f", ""),
              ("gogf/skills", "c22b6e4115e1a3747676419bba98fee99af6beff", "skills/goframe-v2"),
              ("zenstory-ai/drama-skills", "3d813c30871b4db5f2387d83bdc3a49db8ce7b2b", "skills/short-drama"),
              ("cline/skills", "26378461e978f2b4e2e6d67b57121b86b2a79ba5", "skills/data-analyst"),
          )
          results = []
          for repository, revision, root in subjects:
              started = time.monotonic()
              pinned = None
              outcome = {"repository": repository, "revision": revision, "root": root}
              try:
                  pinned = PinnedRepository(repository, revision, None, work_budget=WorkBudget(120))
                  files = bounded_package_files(
                      pinned, root, max_files=2048, max_file_bytes=16 << 20,
                      max_tree_bytes=16 << 20,
                  )
                  assert any(path == "SKILL.md" for path, _, _ in files)
                  outcome.update(status="complete_acquisition", files=len(files),
                                 bytes=sum(len(body) for _, _, body in files))
              except Exception as error:
                  # No source content or credentials in diagnostics.
                  outcome.update(status="failed", failure_type=type(error).__name__,
                                 message=str(error)[:300])
              finally:
                  if pinned is not None:
                      pinned.close()
              outcome["elapsed_seconds"] = round(time.monotonic() - started, 3)
              results.append(outcome)
              print(json.dumps(outcome, sort_keys=True), flush=True)
          Path(os.environ["RUNNER_TEMP"], "failed-root-acquisition.json").write_text(
              json.dumps({"schema_version": 1, "base_report": "54e653bb03edea589ec9f59cf497044c79309a68",
                          "source_commit": "e8d3d940f2faa60ab8391156b279f8f71315b9d6",
                          "subjects": results}, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          assert all(item["status"] == "complete_acquisition" for item in results), (
              "Read-only repro: one or more exact previously failed roots still unavailable; "
              "inspect the retained structured error artifact; no production status changed"
          )
          PY
      - name: Retain read-only diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: skillspector-four-failed-root-acquisition
          path: ${{ runner.temp }}/failed-root-acquisition.json
          if-no-files-found: warn
          retention-days: 7
