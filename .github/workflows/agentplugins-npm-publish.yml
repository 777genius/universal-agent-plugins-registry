name: Agentplugins NPM publisher retired

on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: Keep this historical audit in read-only mode
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce retired publisher boundary
        env:
          VERIFY_ONLY: ${{ inputs.verify_only }}
        run: |
          set -euo pipefail
          if [[ "${VERIFY_ONLY}" != "true" ]]; then
            echo "npm publication is retired in the registry repository; use the canonical CLI repository publisher" >&2
            exit 1
          fi
          echo "Historical registry publisher is retired; no package publication is performed."
