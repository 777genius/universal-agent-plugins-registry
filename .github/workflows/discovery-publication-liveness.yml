name: Discovery publication liveness

on:
  schedule:
    - cron: "31 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: discovery-publication-liveness
  cancel-in-progress: true

jobs:
  detect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Flag abandoned unsigned approval before Discovery expires
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/recover_discovery_publication.py --repo "$GITHUB_REPOSITORY"
