name: Temporary Chrome native registration diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/catalog-native-diagnostic.yml"
      - "scripts/catalog_publication_readiness.py"
      - "tests/test_catalog_publication_readiness.py"

permissions:
  contents: read
  attestations: read

env:
  AGENTPLUGINS_VERSION: "0.1.24"
  AGENTPLUGINS_COMMIT: c78c79e44efd5ad07083d63436d9170b107df6cb
  CLAUDE_CODE_VERSION: "2.1.251"
  CLAUDE_CODE_NPM_INTEGRITY: sha512-eG+ZPPpW2Dbmnntf1Fz9/T9ewS8I8SKfc1tcU2PqSwmftfjRPP7BXPaCyLuZ8kvgTdiPnJi/2/JnTvTRieneEQ==
  COPILOT_VERSION: "1.0.82"
  COPILOT_NPM_INTEGRITY: sha512-+mDIwBO3dCpL3k2rVLc4+1tFzqcVBTJNA/0co+okEpmCgcHjaz91Cqq7++pJKN5yJQuGC6bKangm7PSoheI1Xw==
  INSPECTOR_VERSION: "2.1.0"
  INSPECTOR_NPM_INTEGRITY: sha512-Fp3kvgW5W6tcttErlYKy9iud6nE1oKUUB+qpFgh+ImfvYDJDgtGtx7IHJ+E6K1rXAerr9HQvYQenWrGP8lAqPQ==

jobs:
  produce:
    name: Diagnostic only - Chrome native registration, no publication
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 001863a6b76738f68eca9bb76c0a000b08a55125
          path: staged
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: "24.20.0"}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.13"}
      - run: python3 -m pip install --disable-pip-version-check cryptography==46.0.3 jsonschema==4.26.0
      - name: Install the current stable Ubuntu bubblewrap package and record namespace policy
        run: |
          test "$RUNNER_OS" = Linux
          sudo apt-get update
          candidate="$(apt-cache policy bubblewrap | awk '$1 == "Candidate:" {print $2}')"
          test -n "$candidate"
          test "$candidate" != '(none)'
          sudo apt-get install --yes --no-install-recommends "bubblewrap=$candidate"
          test "$(dpkg-query -W -f='${Version}' bubblewrap)" = "$candidate"
          /usr/bin/bwrap --version
          uname -r
          for setting in /proc/sys/kernel/unprivileged_userns_clone /proc/sys/kernel/apparmor_restrict_unprivileged_userns /proc/sys/user/max_user_namespaces; do
            if test -r "$setting"; then printf '%s=' "$setting"; cat "$setting"; fi
          done
      - name: Allow user namespaces only for the root-owned bubblewrap executable
        id: isolation_profile
        run: |
          test "$RUNNER_OS" = Linux
          test "$GITHUB_ACTIONS" = true
          test -f /usr/bin/bwrap
          test ! -L /usr/bin/bwrap
          test "$(stat -c '%U:%G:%a' /usr/bin/bwrap)" = root:root:755
          test "$(cat /sys/module/apparmor/parameters/enabled)" = Y
          profile=/etc/apparmor.d/uap-catalog-bwrap
          test ! -e "$profile"
          test ! -L "$profile"
          if sudo grep -R -q -F /usr/bin/bwrap /etc/apparmor.d; then
            echo "An existing bubblewrap AppArmor policy requires review" >&2
            exit 1
          else
            test "$?" -eq 1
          fi
          if sudo grep -q '^uap-catalog-bwrap ' /sys/kernel/security/apparmor/profiles; then
            echo "The catalog AppArmor profile is already loaded" >&2
            exit 1
          else
            test "$?" -eq 1
          fi
          sudo /usr/sbin/apparmor_parser --skip-kernel-load --skip-cache tests/e2e/catalog-bwrap.apparmor
          echo "profile_owned=true" >> "$GITHUB_OUTPUT"
          sudo install -o root -g root -m 0644 tests/e2e/catalog-bwrap.apparmor "$profile"
          test "$(stat -c '%U:%G:%a' "$profile")" = root:root:644
          sudo /usr/sbin/apparmor_parser --add --skip-cache "$profile"
      - name: Require Linux child confinement before any untrusted execution
        run: python3 -m unittest tests.test_catalog_process_isolation -v
      - name: Download and authenticate the exact released CLI before execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          gh release download "agentplugins-v${AGENTPLUGINS_VERSION}" \
            --repo 777genius/plugin-kit-ai \
            --pattern "agentplugins_${AGENTPLUGINS_VERSION}_linux_amd64" \
            --pattern checksums.txt --pattern release-manifest.json \
            --dir "$RUNNER_TEMP/release"
          cd "$RUNNER_TEMP/release"
          test "$(sha256sum agentplugins_${AGENTPLUGINS_VERSION}_linux_amd64 | cut -d ' ' -f 1)" = e79125f7ffabd11c6e211d6b049c2eb2b36eb1aba3a76ce27cac819aeba1e6ca
          test "$(sha256sum checksums.txt | cut -d ' ' -f 1)" = 623fb73d0e2f59da8b01399842b0d82b8f6456c6e43db2251c0ea5f9e32f37e3
          test "$(sha256sum release-manifest.json | cut -d ' ' -f 1)" = eb834da8237b13ed36061aeafb4fbb6f4aadeb5a6fbd4a31d43781f456f3d1e2
          sha256sum --check checksums.txt --ignore-missing
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          manifest = json.loads(Path("release-manifest.json").read_text())
          asset = manifest["assets"]["linux-amd64"]
          assert manifest["schema_version"] == 2
          assert manifest["tag"] == f"agentplugins-v{os.environ['AGENTPLUGINS_VERSION']}"
          assert manifest["version"] == os.environ["AGENTPLUGINS_VERSION"]
          assert manifest["commit"] == os.environ["AGENTPLUGINS_COMMIT"]
          assert asset["file"] == f"agentplugins_{os.environ['AGENTPLUGINS_VERSION']}_linux_amd64"
          binary = Path(asset["file"])
          assert asset["size"] == binary.stat().st_size
          assert asset["sha256"] == hashlib.sha256(binary.read_bytes()).hexdigest()
          PY
          for asset in "agentplugins_${AGENTPLUGINS_VERSION}_linux_amd64" checksums.txt release-manifest.json; do
            gh attestation verify "$asset" --repo 777genius/plugin-kit-ai \
              --signer-workflow 777genius/plugin-kit-ai/.github/workflows/agentplugins-release.yml \
              --source-digest "$AGENTPLUGINS_COMMIT" --deny-self-hosted-runners
          done
          chmod +x "agentplugins_${AGENTPLUGINS_VERSION}_linux_amd64"
      - name: Install exact public clients without account credentials
        env:
          TOOLS_ROOT: ${{ runner.temp }}/catalog-tools
        run: |
          test "$(npm view "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" dist.integrity)" = "$CLAUDE_CODE_NPM_INTEGRITY"
          test "$(npm view "@github/copilot@${COPILOT_VERSION}" dist.integrity)" = "$COPILOT_NPM_INTEGRITY"
          test "$(npm view "@modelcontextprotocol/inspector@${INSPECTOR_VERSION}" dist.integrity)" = "$INSPECTOR_NPM_INTEGRITY"
          python3 - <<'PY'
          import json, os, shutil, sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from catalog_process_isolation import run_isolated
          root = Path(os.environ["TOOLS_ROOT"]).resolve()
          root.mkdir(mode=0o700)
          for name in ("home", "tmp", "npm-cache"):
              (root / name).mkdir(mode=0o700)
          env = {
              "PATH": os.environ["PATH"], "LANG": "C.UTF-8", "CI": "true",
              "HOME": str(root / "home"), "USERPROFILE": str(root / "home"),
              "TMPDIR": str(root / "tmp"), "NPM_CONFIG_CACHE": str(root / "npm-cache"),
              "NPM_CONFIG_USERCONFIG": str(root / "home/.npmrc"),
              "NPM_CONFIG_GLOBALCONFIG": str(root / "home/global.npmrc"),
              "GIT_CONFIG_GLOBAL": str(root / "home/.gitconfig"),
              "GIT_CONFIG_NOSYSTEM": "1", "GIT_TERMINAL_PROMPT": "0",
          }
          packages = {
              "@anthropic-ai/claude-code": os.environ["CLAUDE_CODE_VERSION"],
              "@github/copilot": os.environ["COPILOT_VERSION"],
              "@modelcontextprotocol/inspector": os.environ["INSPECTOR_VERSION"],
          }
          npm = str(Path(shutil.which("npm")).resolve(strict=True))
          node_root = Path(shutil.which("node")).resolve(strict=True).parent.parent
          commands = (
              [npm, "install", "--prefix", str(root), "--no-audit", "--no-fund", *[f"{name}@{version}" for name, version in packages.items()]],
              [npm, "audit", "signatures", "--prefix", str(root)],
          )
          for command in commands:
              result = run_isolated(command, writable_root=root.resolve(), cwd=root.resolve(),
                                    env=env, read_only_paths=(node_root,), timeout=600)
              print(result.stdout)
              print(result.stderr, file=sys.stderr)
              result.check_returncode()
          for name, version in packages.items():
              assert json.loads((root / "node_modules" / name / "package.json").read_text())["version"] == version
          PY
      - name: Diagnose one actual candidate lifecycle without publishing acceptance
        run: |
          python3 - <<'PY'
          import argparse, json, os, shutil, sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          import catalog_publication_readiness as gate
          snapshot, identity = gate.load_feed(Path("staged/registry/schemas/1"), Path("registry/publication/trusted-keys.json"))
          assert identity == {"sequence": 20, "snapshot_digest": "sha256:4fd545da5139a9701ee5de07c54927982d19624318aee899ea9d74b0a254b4db"}
          root = Path(os.environ["RUNNER_TEMP"]) / "native-diagnostic-case"
          assert not root.exists()
          tools = Path(os.environ["RUNNER_TEMP"]) / "catalog-tools/node_modules/.bin"
          args = argparse.Namespace(binary=Path(os.environ["RUNNER_TEMP"]) / "release/agentplugins_0.1.24_linux_amd64",
                                    claude=tools / "claude", copilot=tools / "copilot", inspector=tools / "mcp-inspector",
                                    npx=Path(shutil.which("npx")), failure_phase="prepare")
          ctx = {**identity, "directory_origin": "https://raw.githubusercontent.com/777genius/universal-agent-plugins/001863a6b76738f68eca9bb76c0a000b08a55125/registry/schemas/1/"}
          original_child = gate.child
          observed = {}
          def summarize(label, result):
              summary = {"label": label, "exit": result.returncode}
              try:
                  value = json.loads(result.stdout)
                  summary["list_shape"] = isinstance(value, list) and all(isinstance(item, dict) for item in value)
                  if summary["list_shape"]:
                      matches = [item for item in value if isinstance(item.get("id"), str) and item["id"].split("@")[0] == "chrome-devtools"]
                      summary.update(entries=len(value), matches=len(matches),
                                     user_enabled=[item.get("scope") == "user" and item.get("enabled") is True for item in matches])
              except (ValueError, TypeError):
                  summary["json_valid"] = False
              print(json.dumps(summary, sort_keys=True), flush=True)
          def diagnostic_child(argv, **kwargs):
              pre_update = []
              pre_installation = None
              if Path(argv[0]).name.startswith("agentplugins_") and len(argv) > 1 and argv[1] == "update":
                  state = json.loads((root / "state/state-v2.json").read_text())
                  pre_installation = state["installations"][0]
                  for binding in pre_installation["clients"].values():
                      revision = binding.get("package_revision", {})
                      evidence = revision.get("catalog_evidence")
                      pre_update.append({
                          "client": binding.get("client_id"),
                          "surfaces": binding.get("affected_surfaces", [binding.get("client_id")]),
                          "tree_matches": revision.get("tree_digest") == "sha256:9ecf4ff402035206442470907325286174981408a49225af32b9c199ce6e4b99",
                          "manifest_matches": revision.get("manifest_digest") == "sha256:38c16fbaad139fbdca9ab9fc989047d10b97d7422edee49f3dc35d173fb3e22d",
                          "distribution_matches": revision.get("distribution_id") == "chrome-devtools-bridge",
                          "release_sequence": revision.get("release_sequence"),
                          "evidence_digest": gate.digest(gate.publication.canonical_json(evidence)),
                      })
              result = original_child(argv, **kwargs)
              if Path(argv[0]).name.startswith("agentplugins_") and len(argv) > 1 and argv[1] == "update":
                  fixed = {"label": "Released CLI update envelope", "exit": result.returncode,
                           "stdout_bytes": len(result.stdout.encode()), "stderr_present": bool(result.stderr),
                           "pre_update_bindings": sorted(pre_update, key=lambda item: item["client"])}
                  try:
                      value = json.loads(result.stdout)
                      fixed.update(json_valid=isinstance(value, dict), command=value.get("command"), result=value.get("result"))
                      data = value.get("data")
                      if isinstance(data, dict):
                          fixed.update(data_keys=sorted(data), status=data.get("status"), succeeded=data.get("succeeded"),
                                       failed=data.get("failed"), targets=len(data.get("targets", [])) if isinstance(data.get("targets"), list) else None)
                          fixed["target_shapes"] = [{
                              "target": item.get("target"), "status": item.get("status"),
                              "mutated": item.get("output", {}).get("result", {}).get("mutated") if isinstance(item.get("output"), dict) else None,
                              "no_change": item.get("output", {}).get("result", {}).get("no_change") if isinstance(item.get("output"), dict) else None,
                              "output_keys": sorted(item.get("output", {})) if isinstance(item.get("output"), dict) else [],
                              "result_keys": sorted(item.get("output", {}).get("result", {}))
                                  if isinstance(item.get("output", {}), dict) and isinstance(item.get("output", {}).get("result"), dict) else [],
                          } for item in data.get("targets", []) if isinstance(item, dict)]
                          comparisons = []
                          if pre_installation is not None:
                              bindings = list(pre_installation["clients"].values())
                              directory = pre_installation.get("directory", {})
                              for item in data.get("targets", []):
                                  target = item.get("target")
                                  matches = [binding for binding in bindings if target in binding.get("affected_surfaces", [binding.get("client_id")])]
                                  output = item.get("output", {})
                                  revision = matches[0].get("package_revision", {}) if len(matches) == 1 else {}
                                  comparisons.append({
                                      "target": target, "unique_binding": len(matches) == 1,
                                      "tree_matches_output": revision.get("tree_digest") == output.get("tree_digest"),
                                      "manifest_matches_output": revision.get("manifest_digest") == output.get("manifest_digest"),
                                      "revision_matches_output": revision.get("resolved_revision") == output.get("revision"),
                                      "distribution_matches_installation": revision.get("distribution_id") == directory.get("distribution_id"),
                                      "release_matches_installation": revision.get("release_sequence") == directory.get("desired_release_sequence"),
                                  })
                          fixed["revision_comparisons"] = comparisons
                      error = value.get("error")
                      if isinstance(error, dict):
                          fixed["error_keys"] = sorted(error)
                          code = error.get("code")
                          fixed["error_code"] = code if isinstance(code, str) and gate.re.fullmatch(r"[A-Z0-9_.-]{1,80}", code) else None
                  except (ValueError, TypeError):
                      fixed["json_valid"] = False
                  print(json.dumps(fixed, sort_keys=True), flush=True)
              elif Path(argv[0]).name == "claude" and argv[1:] == ["plugin", "list", "--json"]:
                  summarize("original Claude listing", result)
                  home = (root / "home").resolve(strict=True)
                  config = (home / ".claude").resolve(strict=True)
                  assert config.is_relative_to(root.resolve())
                  alternate = dict(kwargs, cwd=home, env=dict(kwargs["env"]))
                  # Run env inside the same sandbox; do not change the isolation allowlist.
                  compared = original_child(["/usr/bin/env", f"CLAUDE_CONFIG_DIR={config}",
                                             "DISABLE_AUTOUPDATER=1", "CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1", *argv], **alternate)
                  summarize("explicit owned config and home cwd", compared)
              elif Path(argv[0]).name == "copilot" and argv[1:] == ["plugin", "list"]:
                  observed["copilot"] = result.stdout.replace("\r\n", "\n").splitlines()
                  normalized = result.stdout.replace("\r\n", "\n")
                  lines = normalized.splitlines()
                  old_entry = gate.re.compile(r"[ \t]+•[ \t]+chrome-devtools@[A-Za-z0-9][A-Za-z0-9._-]*[ \t]+\(v[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?\)[ \t]*")
                  entry = next((line for line in lines if "•" in line), "")
                  entry_shape = gate.re.fullmatch(r"[ \t]*•[ \t]+([A-Za-z0-9][A-Za-z0-9._-]*)@([A-Za-z0-9][A-Za-z0-9._-]*)[ \t]*(.*)", entry)
                  tail = entry_shape.group(3).strip() if entry_shape else ""
                  semver = r"[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?"
                  safe_header = lines[0].strip() if lines else ""
                  if not gate.re.fullmatch(r"[A-Za-z0-9 .,():`'/-]{1,160}", safe_header) or any(value in safe_header for value in ("/home/", "chrome-devtools", "@")):
                      safe_header = "unsafe-or-unknown"
                  safe_tail = tail if gate.re.fullmatch(r"[A-Za-z0-9 ._+()\-]{0,100}", tail) else "unsafe-or-unknown"
                  fixed = {
                      "label": "Copilot listing structure", "exit": result.returncode,
                      "lines": len(lines), "installed_colon": any(line.strip() == "Installed plugins:" for line in lines),
                      "installed_no_colon": any(line.strip() == "Installed plugins" for line in lines),
                      "contains_expected_public_name": any("chrome-devtools" in line for line in lines),
                      "old_entry_matches": sum(old_entry.fullmatch(line) is not None for line in lines),
                      "unicode_bullets": sum("•" in line for line in lines),
                      "ascii_bullets": sum(line.lstrip().startswith(("- ", "* ")) for line in lines),
                      "ansi_escape_present": "\x1b" in normalized,
                      "installed_titlecase_colon": any(line.strip() == "Installed Plugins:" for line in lines),
                      "generic_plugins_colon": any(line.strip() == "Plugins:" for line in lines),
                      "entry_identity_shape": entry_shape is not None,
                      "entry_name_exact": bool(entry_shape and entry_shape.group(1) == "chrome-devtools"),
                      "marketplace_managed_shape": bool(entry_shape and entry_shape.group(2).startswith("agentplugins-")),
                      "tail_v_parenthesized": gate.re.fullmatch(rf"\(v{semver}\)", tail) is not None,
                      "tail_parenthesized": gate.re.fullmatch(rf"\({semver}\)", tail) is not None,
                      "tail_bare_v": gate.re.fullmatch(rf"v{semver}", tail) is not None,
                      "tail_bare": gate.re.fullmatch(semver, tail) is not None,
                      "tail_empty": tail == "",
                      "safe_public_header": safe_header,
                      "safe_public_entry_tail": safe_tail,
                      # Redact every word/number; retain only punctuation layout
                      # needed to define the public CLI contract.
                      "line_skeletons": [gate.re.sub(r"[A-Za-z0-9_]+", "X", line) for line in lines],
                  }
                  print(json.dumps(fixed, sort_keys=True), flush=True)
                  structured = original_child([*argv, "--json"], **kwargs)
                  shape = {"label": "Copilot structured listing", "exit": structured.returncode}
                  try:
                      value = json.loads(structured.stdout)
                      shape.update(json_valid=True, top_type=type(value).__name__)
                      if isinstance(value, (list, dict)):
                          shape["top_size"] = len(value)
                  except (ValueError, TypeError):
                      shape["json_valid"] = False
                  print(json.dumps(shape, sort_keys=True), flush=True)
              return result  # A diagnostic comparison must never turn failure into acceptance.
          gate.child = diagnostic_child
          try:
              gate.run_lifecycle(args, root, gate.selected(snapshot, "chrome-devtools", gate.CHROME), gate.CHROME, ctx)
              print("Diagnostic Chrome lifecycle passed; NOT publication acceptance")
          except Exception as error:
              state = json.loads((root / "state/state-v2.json").read_text())
              bindings = list(state["installations"][0]["clients"].values())
              copilot = next(item for item in bindings if "copilot" in item.get("affected_surfaces", [item["client_id"]]))
              lines = observed.get("copilot", [])
              path_line = lines[2] if len(lines) == 3 else ""
              prefix = "      from " if path_line.startswith("      from ") else "      at " if path_line.startswith("      at ") else ""
              observed_path = Path(path_line.removeprefix(prefix)).resolve(strict=True) if prefix else None
              target = Path(copilot["target_locator"]).resolve(strict=True)
              marketplace_file = observed_path / ".github/plugin/marketplace.json" if observed_path else Path("missing")
              marketplace = json.loads(marketplace_file.read_text()) if marketplace_file.is_file() else {}
              print(json.dumps({"label": "Copilot live path binding",
                                "exact_target_locator": observed_path == target,
                                "path_label_from": prefix == "      from ",
                                "observed_under_case": bool(observed_path and observed_path.is_relative_to(root.resolve())),
                                "observed_contains_target": target.is_relative_to(observed_path) if observed_path else False,
                                "target_contains_observed": observed_path.is_relative_to(target) if observed_path else False,
                                "marketplace_manifest": marketplace_file.is_file(),
                                "marketplace_name_managed": isinstance(marketplace.get("name"), str) and marketplace["name"].startswith("agentplugins-"),
                                "marketplace_exact_plugin": marketplace.get("plugins") == [{"name": "chrome-devtools",
                                    "description": "Community package for Chrome DevTools MCP. Inspect pages, automate flows, analyze performance, and debug browser state.",
                                    "version": "1.7.0-uap.1", "source": "."}]}, sort_keys=True))
              print(f"Diagnostic failed: {args.failure_phase}: {type(error).__name__}")
              raise SystemExit(1)
          finally:
              if root.exists():
                  shutil.rmtree(root)
              assert not root.exists()
          PY
      - name: Remove only this job's ephemeral AppArmor allowance
        if: ${{ always() && steps.isolation_profile.outputs.profile_owned == 'true' }}
        run: |
          profile=/etc/apparmor.d/uap-catalog-bwrap
          if test ! -e "$profile" && test ! -L "$profile"; then exit 0; fi
          test -f "$profile"
          test ! -L "$profile"
          status=0
          sudo /usr/sbin/apparmor_parser --remove --skip-cache "$profile" || status=$?
          sudo rm -- "$profile"
          exit "$status"
