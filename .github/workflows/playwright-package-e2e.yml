name: Playwright package E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'bridges/playwright/**'
      - 'plugins/playwright/**'
      - 'registry/directory.json'
      - 'tests/e2e/cloudflare-package-lifecycle.cjs'
      - 'tests/e2e/playwright-live-readonly.cjs'
      - '.github/workflows/playwright-package-e2e.yml'

permissions:
  contents: read

concurrency:
  group: playwright-package-e2e-${{ github.event_name }}-${{ (github.event_name == 'pull_request' || github.event_name == 'push') && (github.event.pull_request.number || github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  lifecycle:
    name: CLI ${{ matrix.cli }} / eight synthetic profiles
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cli: ['0.1.26', '0.1.45']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.20.0'
      - name: Public CLI add, info, update and remove
        run: node tests/e2e/cloudflare-package-lifecycle.cjs playwright '${{ matrix.cli }}'
      - name: Upload sanitized lifecycle evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-lifecycle-cli-${{ matrix.cli }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cloudflare-package-evidence/playwright/summary.json
          if-no-files-found: error
          retention-days: 14

  live-readonly:
    name: MCP startup and tools/list
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.20.0'
      - name: Verify the pinned MCP interface without invoking browser tools
        run: node tests/e2e/playwright-live-readonly.cjs
