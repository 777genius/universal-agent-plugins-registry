name: registry

on:
  pull_request:
    paths:
      - "registry/**"
      - "plugins/**"
      - "assets/plugin-icons/**"
      - "catalog/v2/catalog.json"
      - "schemas/registry-*.schema.json"
      - "scripts/build_registry.py"
      - "scripts/build_agentplugins_catalog.py"
      - "scripts/portable_paths.py"
      - "scripts/validate_catalog.py"
      - "scripts/repository_identity.py"
      - "tests/test_build_registry.py"
      - "tests/test_repository_identity.py"
      - ".github/workflows/registry.yml"
  push:
    branches: [main]
    paths:
      - "registry/**"
      - "plugins/**"
      - "assets/plugin-icons/**"
      - "catalog/v2/catalog.json"
      - "schemas/registry-*.schema.json"
      - "scripts/build_registry.py"
      - "scripts/build_agentplugins_catalog.py"
      - "scripts/portable_paths.py"
      - "scripts/validate_catalog.py"
      - "scripts/repository_identity.py"
      - "tests/test_build_registry.py"
      - "tests/test_repository_identity.py"

permissions:
  contents: read

concurrency:
  group: registry-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python3 -m pip install check-jsonschema==0.37.4 PyYAML==6.0.3
      - run: python3 -m unittest tests.test_build_registry
      - run: python3 scripts/build_registry.py --check
      - run: check-jsonschema --schemafile schemas/registry-entry.schema.json registry/entries/*.json
        if: ${{ hashFiles('registry/entries/*.json') != '' }}
      - run: check-jsonschema --schemafile schemas/registry-index.schema.json registry/index.json
