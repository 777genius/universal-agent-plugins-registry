name: SkillSpector #470 shadow epoch safety qualification
on:
  pull_request:
    paths:
      - scripts/skillspector_470_current_snapshot.py
      - tests/test_skillspector_470_current_snapshot.py
      - scripts/skillspector_470_epoch.py
      - scripts/skillspector_470_pinned_replay_e2e.py
      - tests/test_skillspector_470_epoch.py
      - .github/workflows/skillspector-470-shadow-epoch.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  shadow-epoch-unit-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Run fail-closed shadow epoch negatives
        run: python3 -m unittest -v tests.test_skillspector_470_epoch
      - name: Replay original immutable v3 Errors and historical acquisition artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m scripts.skillspector_470_pinned_replay_e2e "$RUNNER_TEMP/skillspector-470-original-source-proof.json"
      - name: Upload independent read-only proof
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skillspector-470-source-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/skillspector-470-original-source-proof.json
          if-no-files-found: error
          retention-days: 14
  current-source-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Fail-closed original/current source admission tests
        run: python3 -m unittest -v tests.test_skillspector_470_current_snapshot
      - name: Independently verify immutable index and five exact shards
        run: python3 -m scripts.skillspector_470_current_snapshot "$RUNNER_TEMP/current-470-admission.json"
      - name: Upload non-authorizing original proof
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skillspector-470-current-admission-${{ github.run_id }}
          path: ${{ runner.temp }}/current-470-admission.json
          if-no-files-found: error
          retention-days: 30
