name: SkillSpector #470 shadow epoch safety qualification
on:
  pull_request:
    paths:
      - scripts/skillspector_470_epoch.py
      - tests/test_skillspector_470_epoch.py
      - .github/workflows/skillspector-470-shadow-epoch.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shadow-epoch-unit-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Run fail-closed shadow epoch negatives
        run: python3 -m unittest -v tests.test_skillspector_470_epoch
