name: SkillSpector 2.13.3 schema PR7 read-only acceptance

on:
  pull_request:
    paths:
      - ".github/workflows/skillspector-2133-schema-pr7-canary.yml"

permissions:
  contents: read

# Keep only one exact-source qualification of this temporary PR in flight.
concurrency:
  group: skillspector-schema-pr7-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  schema-e2e:
    name: pinned-fork-schema-live-cli
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact new scanner fork HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: 777genius/SkillSpector
          ref: 523c6d8f03af57fc71eba69d7074c14cb42975a0
          path: fork-head
          persist-credentials: false
      - name: Checkout exact old scanner fork HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: 777genius/SkillSpector
          ref: 89000abff0d5662728849f35f9017a85a64db96a
          path: fork-base
          persist-credentials: false
      - name: Checkout source-qualified genuine Telnyx Skill
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: team-telnyx/ai
          ref: 51066f5c677d00fbfce47fe479f1324837f4acca
          path: source
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.10.x"
          enable-cache: false
      - name: Verify exact immutable scanner and source commits
        run: |
          test "$(git -C fork-head rev-parse HEAD)" = 523c6d8f03af57fc71eba69d7074c14cb42975a0
          test "$(git -C fork-base rev-parse HEAD)" = 89000abff0d5662728849f35f9017a85a64db96a
          test "$(git -C source rev-parse HEAD)" = 51066f5c677d00fbfce47fe479f1324837f4acca
      - name: Install frozen scanner runtime and test framework
        run: |
          uv sync --directory fork-head --frozen --all-extras --python 3.12
          uv pip install --python fork-head/.venv/bin/python "ruff==0.15.19"
      - name: Run strict targeted unit and negative regression tests
        working-directory: fork-head
        run: |
          .venv/bin/python -m pytest -q \
            tests/test_schema_table_references.py \
            tests/test_reference_destinations.py \
            tests/test_json_version_references.py \
            tests/test_out_of_bundle_reference_coverage.py
      - name: Run full nonprovider nonintegration test suite
        working-directory: fork-head
        timeout-minutes: 20
        run: .venv/bin/python -m pytest -q -m "not integration and not provider" tests/
      - name: Compare old and new real no-LLM CLI on immutable Telnyx source
        run: |
          set -euo pipefail
          SOURCE_ROOT="$GITHUB_WORKSPACE/source/skills/telnyx-fax-curl"
          mkdir -p "$RUNNER_TEMP/schema-canary"
          for version in base head; do
            set +e
            PYTHONPATH="$GITHUB_WORKSPACE/fork-$version/src" \
              timeout 180s "$GITHUB_WORKSPACE/fork-head/.venv/bin/skillspector" \
              scan "$SOURCE_ROOT" --no-llm --format json --fail-on-incomplete \
              > "$RUNNER_TEMP/schema-canary/$version.json" \
              2> "$RUNNER_TEMP/schema-canary/$version.stderr"
            code=$?
            set -e
            if [[ "$code" != "0" && "$code" != "1" ]]; then
              echo "Scanner $version execution failed (exit $code)" >&2
              exit 1
            fi
          done
          python3 - "$RUNNER_TEMP/schema-canary" <<'PY'
          import json, pathlib, sys
          target = pathlib.Path(sys.argv[1])
          old = json.loads((target / "base.json").read_text())
          new = json.loads((target / "head.json").read_text())
          def missing(report, needle):
              return [r for r in report["analysis_completeness"]["references"]
                      if r.get("status") == "missing" and needle in r.get("evidence", "")]
          assert missing(old, "data.id"), "pinned baseline has no reproduced false missing field"
          assert not missing(new, "data.id"), "new scanner still misclassifies data.id"
          # The real scanner JSON stores security findings as 'issues'.
          # Comparing 'findings' here would vacuously pass with 0 vs 0.
          def stable_issues(report):
              return [{k: v for k, v in issue.items() if k != "finding_id"}
                      for issue in report["issues"]]
          assert len(old["issues"]) == len(new["issues"]) > 0, "real security issues disappeared"
          assert stable_issues(old) == stable_issues(new), "real security issues changed"
          assert old["risk_assessment"] == new["risk_assessment"], "risk assessment changed"
          assert old["components"] == new["components"], "inspected components changed"
          assert old["execution_successful"] and new["execution_successful"], "static execution incomplete"
          assert old["analysis_completeness"]["status"] == "partial"
          assert new["analysis_completeness"]["status"] == "partial"
          # Existing real missing dependencies remain explicitly Partial.
          def ref_key(r):
              return (r.get("source_path"), r.get("line"), r.get("column"),
                      r.get("status"), r.get("evidence"))
          old_rows = {ref_key(row) for row in old["analysis_completeness"]["references"]}
          new_rows = {ref_key(row) for row in new["analysis_completeness"]["references"]}
          assert new_rows < old_rows, "missing reference removal did not improve"
          assert len(old_rows - new_rows) >= 5
          assert len(new_rows) > 0, "unexpectedly hid all incomplete references"
          out = {"base_missing_data_id": len(missing(old, "data.id")),
                 "head_missing_data_id": len(missing(new, "data.id")),
                 "removed_false_missing_references": len(old_rows - new_rows),
                 "remaining_missing_references": len(new_rows),
                 "security_issue_count": len(old["issues"]),
                 "security_findings_preserved": True,
                 "remains_honestly_partial": True,
                 "new_execution_successful": True}
          (target / "acceptance.json").write_text(json.dumps(out, sort_keys=True))
          print(json.dumps(out, sort_keys=True))
          PY
      - name: Check strict Ruff lint and formatting
        working-directory: fork-head
        run: |
          .venv/bin/ruff check --select I001 --diff tests/test_schema_table_references.py || true
          .venv/bin/ruff format --diff src/skillspector/references.py tests/test_schema_table_references.py || true
          .venv/bin/ruff check src/skillspector/references.py tests/test_schema_table_references.py
          .venv/bin/ruff format --check src/skillspector/references.py tests/test_schema_table_references.py
      - name: Retain independent immutable CLI evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: skillspector-2133-schema-pr7-acceptance
          path: ${{ runner.temp }}/schema-canary/
          if-no-files-found: warn
          retention-days: 7
