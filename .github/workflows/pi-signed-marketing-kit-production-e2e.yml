name: Pi signed saved Marketing Kit production E2E

# Explicit manual qualification only. The published Directory currently has
# zero Pi targets; a genuine refusal is FAILURE, not an expected green result.
# A green 4-package slice is necessary but never sufficient for 72/72 or signing.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pi-signed-marketing-kit-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-marketing-kit:
    name: Signed saved Pi Marketing Kit / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.21.1'
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Confirm tested source and public CLI, no synthetic Directory override
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(npm view universal-agent-plugins@0.1.114 version)" = "0.1.114"
          npm install --global universal-agent-plugins@0.1.114
          npm install --global --ignore-scripts @earendil-works/pi-coding-agent@1.5.0
          test "$(agentplugins version)" = "agentplugins 0.1.114"
          test "$(pi --version)" = "1.5.0"
      - name: Execute real production-default signed saved User/Project lifecycle
        shell: bash
        run: |
          set -euo pipefail
          python scripts/pi_signed_marketing_kit_e2e.py \
            --cli-version 0.1.114 \
            --report "$RUNNER_TEMP/pi-signed-marketing-${{ matrix.os }}.json"
      - name: Retain strict positive or genuine refusal report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pi-signed-marketing-${{ matrix.os }}
          path: ${{ runner.temp }}/pi-signed-marketing-${{ matrix.os }}.json
          if-no-files-found: warn
          retention-days: 14
