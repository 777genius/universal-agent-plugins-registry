name: SkillSpector #482 immutable cohort security-parity proof
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - scripts/skillspector_cohort9_semantic_parity_v2.py
      - scripts/skillspector_cohort9_fetch_e2e.py
      - .github/workflows/skillspector-cohort9-security-parity.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  immutable-evidence-parity:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Audit original GitHub ZIPs and adversarial security negatives
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROOF_OUTPUT: ${{ runner.temp }}/skillspector-cohort9-semantic-parity-v2.json
        run: python3 -m scripts.skillspector_cohort9_fetch_e2e
      - name: Preserve unpromoted semantic proof
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skillspector-cohort9-parity-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/skillspector-cohort9-semantic-parity-v2.json
          if-no-files-found: error
          retention-days: 14
