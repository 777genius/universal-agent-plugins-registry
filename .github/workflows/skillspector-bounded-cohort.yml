name: SkillSpector bounded cohort readback

on:
  pull_request:
    paths:
      - "scripts/skillspector_bounded_cohort.py"
      - "tests/test_bounded_cohort.py"
      - ".github/workflows/skillspector-bounded-cohort.yml"

permissions:
  contents: read

jobs:
  pinned-nine-source-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned read-only verification dependencies
        run: python3 -m pip install --disable-pip-version-check cryptography==46.0.3 jsonschema==4.26.0 PyYAML==6.0.3
      - name: Reject changed pins, genuine missing files and unsupported evidence
        run: python3 -m unittest tests.test_bounded_cohort -v
      - name: Fetch and validate the last immutable production v3 bundle
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -m scripts.publish_skillspector_coverage_v3 previous \
            --output-dir "${RUNNER_TEMP}/cohort-baseline"
      - name: Prove full legacy-to-mixed report migration without stale or evidence loss
        run: |
          python3 - <<'PY'
          import json
          import os
          import tempfile
          from pathlib import Path
          from scripts import skillspector_contract as contract
          from scripts import skillspector_coverage_v3 as coverage
          from scripts import skillspector_reports as scanner
          from scripts.directory_publication import canonical_json, sha256_digest

          original = coverage.read_bundle(Path(os.environ["RUNNER_TEMP"]) / "cohort-baseline")
          assert original is not None
          assert original["manifest"]["profile"] in (contract.LEGACY_POLICY, contract.PROFILE)
          selection = original["selection"]
          source_commit = original["manifest"]["source_commit"]
          empty_worker = {
              "schema_version": 3, "source_commit": source_commit,
              "generated_at": scanner.now(),
              "selection_digest": sha256_digest(canonical_json(selection)),
              "scanner": scanner.SCANNER, "profile": contract.PROFILE,
              "partition": {"index": 0, "count": 1}, "attempts": [],
          }
          # A publication-format round trip of every actual old record, not a
          # handful of synthetic fixtures. No source scan, signer or remote write.
          with tempfile.TemporaryDirectory(prefix="skillspector-migration-proof-") as tmp:
              coverage.merge_reports(
                  selection, original, [empty_worker], source_commit=source_commit,
                  output_dir=Path(tmp), discovery_summary=original["discovery"],
                  expected_partition_count=1,
              )
              migrated = coverage.read_bundle(Path(tmp))
          assert migrated is not None
          assert migrated["manifest"]["profile"] == contract.PROFILE
          assert migrated["manifest"]["profiles"] == scanner.ALL_PROFILES
          assert migrated["manifest"]["coverage"] == original["manifest"]["coverage"], (
              "migration changed published Complete/Partial/Error/Pending/stale counts"
          )
          assert migrated["records"].keys() == original["records"].keys()
          for identifier, prior in original["records"].items():
              current = migrated["records"][identifier]
              for field in (
                  "status", "freshness", "source", "scanner", "profile", "coverage",
                  "findings", "finding_count", "raw_finding_count",
                  "finding_group_count", "errors", "attempt_history",
              ):
                  assert current[field] == prior[field], "migration changed original scan evidence"
          summary = migrated["manifest"]["coverage"]
          print(json.dumps({
              "migration": "verified_without_publication",
              "records": len(migrated["records"]), "profiles": len(scanner.ALL_PROFILES),
              "selected": summary["selected"], "complete": summary["complete"],
              "partial": summary["partial"], "error": summary["error"],
              "pending": summary["pending"], "stale": summary["stale"],
          }, sort_keys=True))
          PY
      - name: Require nine current immutable historical-Partial witnesses
        run: |
          REPORT_COMMIT=$(python3 -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"cohort-baseline/publication-base.json"; print(json.loads(p.read_text())["report_commit"])')
          test -n "$REPORT_COMMIT"
          python3 -m scripts.skillspector_bounded_cohort \
            --previous-dir "${RUNNER_TEMP}/cohort-baseline" \
            --current-selection "${RUNNER_TEMP}/cohort-baseline/selection.json" \
            --report-commit "$REPORT_COMMIT" \
            --output "${RUNNER_TEMP}/bounded-cohort/plan.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          import os
          p = Path(os.environ["RUNNER_TEMP"]) / "bounded-cohort/plan.json"
          proof = json.loads(p.read_text(encoding="utf-8"))
          assert len(proof["selection"]["sources"]) == 9
          assert proof["candidate_status"] == "not_scanned"
          assert proof["live_selection_verified"] is False
          assert proof["publication_authorized"] is False
          print("Published-baseline cohort witnessed; fresh discovery and production rollout remain unverified")
          PY
      - name: Retain bounded non-publishing admission proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skillspector-bounded-cohort-preflight
          path: ${{ runner.temp }}/bounded-cohort/
          if-no-files-found: warn
          retention-days: 7
