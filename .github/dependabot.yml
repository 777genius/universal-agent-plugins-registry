# Keep Dependabot focused on security fixes. A zero PR limit disables only
# version updates; security updates remain enabled.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    groups:
      github-actions:
        applies-to: security-updates
        patterns:
          - "*"
    labels:
      - dependencies
      - security
    open-pull-requests-limit: 0
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    groups:
      site:
        applies-to: security-updates
        patterns:
          - "*"
    labels:
      - dependencies
      - security
    open-pull-requests-limit: 0
